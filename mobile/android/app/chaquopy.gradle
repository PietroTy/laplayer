// chaquopy.gradle — Groovy DSL for Chaquopy configuration.
// Applied from app/build.gradle.kts via apply(from = "chaquopy.gradle").
// Groovy's dynamic dispatch resolves the python{} extension without needing
// Kotlin DSL type-safe accessor generation (which fails with Flutter's includeBuild setup).

android.defaultConfig {
    python {
        version "3.10"
        pip {
            // Instala o librespot-python e mutagen para baixar via protocolo Spotify diretamente
            install "librespot-python"
            install "mutagen"
            install "protobuf"
        }
    }
}
