name: la_player
description: Offline-first music player with Spotify library sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Áudio ──────────────────────────────────────────────────────────────
  just_audio: ^0.9.40              # Reprodução de áudio (local + streaming)
  audio_service: ^0.18.13          # Background audio + notificação do sistema
  audio_session: ^0.1.21           # Gerenciamento de sessão de áudio

  # ── Estado ─────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1         # State management

  # ── Banco de dados local ───────────────────────────────────────────────
  sqflite: ^2.3.3                  # SQLite nativo
  path: ^1.9.0                     # Paths cross-platform

  # ── Rede / Sync ────────────────────────────────────────────────────────
  dio: ^5.4.3                      # HTTP client robusto
  web_socket_channel: ^3.0.1       # WebSocket para notificações em tempo real
  shared_preferences: ^2.2.3       # Configurações simples (IP do servidor, etc.)

  # ── UI / Assets ────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1     # Cache de imagens
  flutter_cache_manager: ^3.3.1    # Gerenciador de cache
  google_fonts: ^6.2.1             # Tipografia
  shimmer: ^3.0.0                  # Loading skeleton

  # ── Navegação ──────────────────────────────────────────────────────────
  go_router: ^14.2.7               # Navegação declarativa

  # ── Utilitários ────────────────────────────────────────────────────────
  intl: ^0.19.0                    # Formatação de duração/datas
  path_provider: ^2.1.3            # Diretórios do sistema
  permission_handler: ^11.3.1      # Permissões Android/iOS
  file_picker: ^8.0.0              # Seletor de diretórios nativo
  crypto: ^3.0.3                   # SHA-256 para diff de sync
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icon_flat.png"
  adaptive_icon_background: "#0D0B18"
  adaptive_icon_foreground: "assets/app_icon_flat.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo_clean.png
    - assets/app_logo_glyph.png
